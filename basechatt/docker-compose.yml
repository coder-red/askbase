name: basechatt

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: basechatt-postgres
    environment:
      POSTGRES_USER: basechatt
      POSTGRES_PASSWORD: basechatt
      POSTGRES_DB: basechatt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basechatt -d basechatt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: basechatt-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: basechatt-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
  redisdata:
  appdata: