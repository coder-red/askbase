# BaseChatt seed company universe.
#
# Approximately 20 Nigerian-listed companies spanning banking, financial
# services, telecommunications, consumer, industrial, energy and healthcare.
# The universe can be expanded without changing any code — add a new entry and
# the connectors lookup these identifiers automatically.
#
# Fields:
#   ticker       : NGX ticker symbol (e.g. GTCO)
#   ngx_symbol   : NGX/long symbol where different from ticker
#   name         : full legal / brand name
#   sector       : broad sector label used for filtering
#   ir_url       : investor-relations page used by the CompanyIR connector
#   cbn_license  : optional CBN license category (banks)
#
# NOTE: identifiers are best-effort public references. The CompanyIR connector
# falls back to search/discovery when a URL is missing or unreachable.

